name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install verified release JDK
        shell: pwsh
        run: ./scripts/setup-release-jdk.ps1
      - name: Build client and local backend
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test backend and signed updater
        shell: pwsh
        run: |
          ./scripts/test-offline.ps1
          ./scripts/test-updater.ps1
          ./scripts/test-channel-publication.ps1
          ./scripts/test-schedule.ps1
          ./scripts/test-workbench.ps1
          ./scripts/test-maintenance.ps1
      - name: Install verified installer build tools
        shell: pwsh
        run: ./scripts/setup-installer-tools.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-installer-build-tools
          path: artifacts/installer-tools/
          retention-days: 1
      - name: Build and verify one-click installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1
          [xml]$project=Get-Content client-winui/ResumeStudio.csproj
          ./scripts/test-installer.ps1 -SetupPath "release/ResumeStudio-v$($project.Project.PropertyGroup.Version)-Setup-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ResumeStudio-installer
          path: release/*-Setup-x64.exe
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.RESUMESTUDIO_INSTALLER_TEST_OUTPUT != ''
        with:
          name: installer-acceptance
          path: ${{ env.RESUMESTUDIO_INSTALLER_TEST_OUTPUT }}
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ResumeStudio-windows-x64
          path: release/ResumeStudio/
          retention-days: 14
