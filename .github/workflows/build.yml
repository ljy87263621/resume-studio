name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install verified release JDK
        shell: pwsh
        run: ./scripts/setup-release-jdk.ps1
      - name: Build client and local backend
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test public job parsing and robots rules
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend/build/test-classes | Out-Null
          & "$env:JAVA_HOME/bin/javac.exe" -encoding UTF-8 -Xlint:all -Werror -cp backend/build/classes -d backend/build/test-classes backend/src/test/java/com/resumestudio/CompanyJobsTest.java
          if ($LASTEXITCODE -ne 0) { throw 'Test compile failed' }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'backend/build/classes;backend/build/test-classes' com.resumestudio.CompanyJobsTest
          if ($LASTEXITCODE -ne 0) { throw 'Job parsing tests failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ResumeStudio-windows-x64
          path: release/ResumeStudio/
          retention-days: 14
