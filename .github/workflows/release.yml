name: Publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: microsoft
          java-version: '21.0.12.1'
      - name: Build and package
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/package.ps1
      - name: Include corresponding OpenJDK source
        shell: pwsh
        run: |
          $source = 'release/microsoft-openjdk-jdk21u-6f26c6b2.tar.gz'
          Invoke-WebRequest 'https://codeload.github.com/microsoft/openjdk-jdk21u/tar.gz/6f26c6b2b098814858e76ad2986c01d5e1c8987a' -OutFile $source
          $hash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content release/SHA256SUMS.txt "$hash  microsoft-openjdk-jdk21u-6f26c6b2.tar.gz" -Encoding utf8
      - name: Publish v0.3.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 release/ResumeStudio-v0.3.0-windows-x64.zip release/microsoft-openjdk-jdk21u-6f26c6b2.tar.gz release/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title '拾简 v0.3.0 — Windows x64' --notes-file .github/release-notes/v0.3.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
