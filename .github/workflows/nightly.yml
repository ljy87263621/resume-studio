name: Publish Nightly
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Check for source changes
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha=(git rev-parse HEAD).Trim()
          $releases=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot query existing releases'}
          $last=@($releases|Where-Object {$_.prerelease -and !$_.draft -and $_.tag_name -match '^nightly-'}|Sort-Object published_at -Descending|Select-Object -First 1)
          if($last.Count -and $last[0].body.Contains("source-commit: $sha")){
            Add-Content $env:GITHUB_OUTPUT 'changed=false'
            Write-Output 'Source unchanged since successful Nightly; no new release.'
            exit 0
          }
          $day=[DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString('yyyyMMdd')
          [xml]$project=Get-Content client-winui/ResumeStudio.csproj
          $base=[string]$project.Project.PropertyGroup.Version
          $short=$sha.Substring(0,8)
          Add-Content $env:GITHUB_OUTPUT 'changed=true'
          Add-Content $env:GITHUB_OUTPUT "tag=nightly-$day-$short"
          Add-Content $env:GITHUB_OUTPUT "label=$base-nightly.$day.$short"
          Add-Content $env:GITHUB_OUTPUT "sha=$sha"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: steps.source.outputs.changed == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Install verified release JDK
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        run: ./scripts/setup-release-jdk.ps1
      - name: Build and test Nightly
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Channel nightly -BuildTag '${{ steps.source.outputs.tag }}'
          ./scripts/test-offline.ps1
          ./scripts/test-updater.ps1
          ./scripts/test-schedule.ps1
          ./scripts/package.ps1 -PackageLabel '${{ steps.source.outputs.label }}'
      - name: Sign update metadata
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        env:
          RESUMESTUDIO_UPDATE_SIGNING_KEY: ${{ secrets.RESUMESTUDIO_UPDATE_SIGNING_KEY }}
        run: ./scripts/sign-release.ps1 -PackagePath 'release/ResumeStudio-v${{ steps.source.outputs.label }}-windows-x64.zip'
      - name: Include corresponding OpenJDK source
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        run: |
          $source='release/microsoft-openjdk-jdk21u-6f26c6b2.tar.gz'
          Invoke-WebRequest 'https://codeload.github.com/microsoft/openjdk-jdk21u/tar.gz/6f26c6b2b098814858e76ad2986c01d5e1c8987a' -OutFile $source
          $hash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content release/SHA256SUMS.txt "$hash  microsoft-openjdk-jdk21u-6f26c6b2.tar.gz" -Encoding utf8
      - name: Publish Nightly prerelease
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha='${{ steps.source.outputs.sha }}'
          $notes="Nightly 每日测试版，可能包含尚未稳定的改动。`n`n源码提交：$sha`n`n<!-- source-commit: $sha -->"
          $notes | Set-Content release/nightly-notes.md -Encoding utf8
          gh release create '${{ steps.source.outputs.tag }}' 'release/ResumeStudio-v${{ steps.source.outputs.label }}-windows-x64.zip' release/release-info.json release/release-info.sig release/microsoft-openjdk-jdk21u-6f26c6b2.tar.gz release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target $sha --title '拾简 Nightly ${{ steps.source.outputs.tag }} — Windows x64' --prerelease --latest=false --notes-file release/nightly-notes.md
          if($LASTEXITCODE -ne 0){throw 'Nightly publication failed'}
