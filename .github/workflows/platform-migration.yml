name: Publish legacy update migration
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [nightly, stable]
        default: nightly
      commit:
        description: Full commit of both verified platform releases
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: platform-update-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish one-time signed legacy bridge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESUMESTUDIO_UPDATE_SIGNING_KEY: ${{ secrets.RESUMESTUDIO_UPDATE_SIGNING_KEY }}
        run: ./scripts/publish-platform-migration.ps1 -Channel '${{ inputs.channel }}' -Commit '${{ inputs.commit }}'
